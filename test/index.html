<!doctype html>
<html>
<head><meta charset="utf-8"><title>Grok Player test</title>
<style>body{font:14px system-ui;background:#0e0e10;color:#ddd;padding:140px 24px}button{margin:4px;padding:8px 12px}</style>
<!-- loads exactly like the extension: before any page script -->
<script src="../content.js"></script>
</head>
<body>
<p>Simulates Grok's read-aloud paths. Click one:</p>
<button id="a">new Audio() — 40s WAV</button>
<button id="m">MediaSource stream (detached)</button>
<button id="w">Web Audio chunks</button>
<button id="s">speechSynthesis</button>
<script>
// 40s of a slowly sweeping tone as a WAV blob
function wav(sec, sr = 8000) {
  const n = sec * sr, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin(i / sr * 2 * Math.PI * (220 + 40 * Math.sin(i / sr))) * 3000, true);
  return new Blob([b], { type: 'audio/wav' });
}
a.onclick = () => { window.au = new Audio(URL.createObjectURL(wav(40))); au.play(); };
w.onclick = async () => {
  const ctx = window.ctx = new AudioContext();
  let t = ctx.currentTime + 0.1;
  for (let i = 0; i < 6; i++) {
    const buf = await ctx.decodeAudioData(await wav(3).arrayBuffer());
    const s = ctx.createBufferSource(); s.buffer = buf; s.connect(ctx.destination); s.start(t); t += buf.duration;
  }
};
s.onclick = () => speechSynthesis.speak(new SpeechSynthesisUtterance('This is a read aloud test. '.repeat(12)));
m.onclick = () => {
  // Fake streaming: MediaSource with duration Infinity until "end of stream"
  const ms = new MediaSource(); const el = window.au = new Audio(URL.createObjectURL(ms)); el.play().catch(e => console.log('mse play', e));
  ms.addEventListener('sourceopen', () => { console.log('MSE open; no mp3 encoder here, just checks hooking'); });
};
</script>
</body>
</html>
